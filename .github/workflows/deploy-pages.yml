name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build web
        env:
          PARSE_APPLICATION_ID: ${{ secrets.PARSE_APPLICATION_ID || vars.PARSE_APPLICATION_ID }}
          PARSE_CLIENT_KEY: ${{ secrets.PARSE_CLIENT_KEY || vars.PARSE_CLIENT_KEY }}
        run: |
          if [ -z "$PARSE_APPLICATION_ID" ]; then
            echo "::error::PARSE_APPLICATION_ID não configurado em Secrets nem Variables."
            exit 1
          fi
          if [ -z "$PARSE_CLIENT_KEY" ]; then
            echo "::error::PARSE_CLIENT_KEY não configurado em Secrets nem Variables."
            exit 1
          fi
          flutter build web --release \
            --base-href "/Brilhart_Sistem/" \
            --dart-define=APP_ENV=production \
            --dart-define=PARSE_APPLICATION_ID="$PARSE_APPLICATION_ID" \
            --dart-define=PARSE_CLIENT_KEY="$PARSE_CLIENT_KEY"

      - name: SPA fallback and no Jekyll
        run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
