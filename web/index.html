<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema Web/PWA interno da Brilhart Laqueamentos.">
  <meta name="theme-color" content="#070707">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Brilhart">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Brilhart Sistem</title>
</head>
<body>
  <script>
    (async function () {
      const cacheVersion = 'brilhart-20260925-08';
      const cacheKey = 'brilhart_cache_version';

      try {
        if (localStorage.getItem(cacheKey) !== cacheVersion) {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(names.map((name) => caches.delete(name)));
          }

          localStorage.setItem(cacheKey, cacheVersion);
        }
      } catch (_) {
        // Cache cleanup is best-effort. App bootstrap must continue.
      }

      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + cacheVersion;
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
