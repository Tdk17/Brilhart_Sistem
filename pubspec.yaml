name: brilhart_sistem
description: Sistema interno Web/PWA da BrilhArte Laqueamentos.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.3
  get_it: ^8.0.3
  go_router: ^16.2.1
  http: ^1.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  signals: ^6.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/brilhart_logo.png
